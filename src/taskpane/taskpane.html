<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gesetz-Tooltip</title>
    <link rel="icon" type="image/png" href="../../assets/icon-32.png" />

    <!-- Office JavaScript API -->
    <script
      type="text/javascript"
      src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"
    ></script>

    <link href="taskpane.css" rel="stylesheet" type="text/css" />
  </head>

  <body>
    <!-- Nur außerhalb von Word sichtbar: ein Textfeld, das das Word-Dokument spielt. -->
    <section id="demo" class="demo-document" hidden>
      <header class="demo-header">
        <h1>Gesetz-Tooltip <span class="demo-badge">Demo ohne Word</span></h1>
        <p>
          Setze den Cursor in ein Normzitat. Rechts erscheint, was das Add-in in Word im
          Seitenbereich zeigt.
        </p>
      </header>
      <textarea spellcheck="false" aria-label="Beispieldokument"></textarea>
    </section>

    <section id="panel" class="panel" aria-label="Normtext"></section>
  </body>
</html>
